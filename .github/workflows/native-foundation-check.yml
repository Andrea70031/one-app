name: ONE Native Check
on:
  push:
    branches: [main, 'codex/one-*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  native-check:
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx expo export --platform ios --output-dir dist/ios
